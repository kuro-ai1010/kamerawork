<title>撮影用語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 構成 左寄せの見出し → 固定の操作バー → 5つの章。各章は動く見本カードのグリッド。見本は暗い撮影ステージ、画面まわりは静かな中間色 */
:root{
  --bg:#f1f2f5; --surface:#ffffff; --surface2:#e9ebf0; --ink:#151922; --muted:#586070;
  --line:#d8dbe2; --accent:#2b59e0; --accent-ink:#ffffff; --accent-soft:#e3eafc;
  --stage:#0b0d12; --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --surface:#161a21; --surface2:#1e232c; --ink:#eceff4; --muted:#9aa3b2;
  --line:#2a303b; --accent:#8aa6ff; --accent-ink:#0e1116; --accent-soft:#1b2540; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161a21; --surface2:#1e232c; --ink:#eceff4; --muted:#9aa3b2;
  --line:#2a303b; --accent:#8aa6ff; --accent-ink:#0e1116; --accent-soft:#1b2540; color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 見出し */
.hero{padding-block:clamp(36px,7vw,72px) 28px}
.kicker{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
h1{font-weight:900;font-size:clamp(2.7rem,8vw,4.8rem);line-height:1.05;letter-spacing:-.01em;margin:0 0 20px;text-wrap:balance}
.lead{max-width:34em;font-size:1.02rem;color:var(--muted);margin:0 0 22px;text-wrap:pretty}
.steps{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;padding:0;list-style:none;font-size:.9rem}
.steps li{display:flex;gap:8px;align-items:baseline}
.steps span{font:500 11px/1 var(--mono);color:var(--accent)}

/* 操作バー */
.bar{position:relative;z-index:20;background:var(--bg);border-block:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:10px}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;outline:0}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-size:.82rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{font:500 12px var(--mono);color:var(--muted);min-width:4.5em;text-align:right}
.chips{flex:1 1 100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:.84rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

@media (min-width:760px){.bar{position:sticky;top:env(safe-area-inset-top,0px)}}
/* 章 */
main{padding-block:8px 40px}
.sec{padding-top:52px;scroll-margin-top:96px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:6px}
.sec h2{margin:0;font-size:1.65rem;font-weight:900;line-height:1.3}
.sec .en{font:500 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.sec-lead{margin:0 0 22px;color:var(--muted);max-width:42em}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* カード */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.frame{position:relative;aspect-ratio:16/10;background:var(--stage);max-width:100%;cursor:pointer;overflow:hidden;touch-action:manipulation}
.frame svg.scene,.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame canvas{object-fit:cover}
.frame i{position:absolute;width:14px;height:14px;border:0 solid rgba(255,255,255,.85);pointer-events:none}
.frame i:nth-of-type(1){top:7px;left:7px;border-top-width:2px;border-left-width:2px}
.frame i:nth-of-type(2){top:7px;right:7px;border-top-width:2px;border-right-width:2px}
.frame i:nth-of-type(3){bottom:7px;left:7px;border-bottom-width:2px;border-left-width:2px}
.frame i:nth-of-type(4){bottom:7px;right:7px;border-bottom-width:2px;border-right-width:2px}
.hud{position:absolute;top:14px;left:16px;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none}
.hud span{font:500 10.5px/1.5 var(--mono);color:#fff;background:rgba(10,12,16,.66);padding:1px 7px;border-radius:4px;white-space:nowrap}
.pause{position:absolute;bottom:14px;left:16px;font:500 10px/1.5 var(--mono);letter-spacing:.1em;color:#fff;background:rgba(10,12,16,.66);padding:1px 7px;border-radius:4px;opacity:0;transition:opacity .15s;pointer-events:none}
.frame.is-paused .pause{opacity:1}
.mini{position:absolute;right:14px;bottom:14px;width:56px;height:56px;border-radius:50%;background:rgba(10,12,16,.62);pointer-events:none}
.mini text{font:500 7px var(--mono);fill:rgba(255,255,255,.7)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.names{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.card h3{margin:0;font-size:1.2rem;font-weight:900;line-height:1.35}
.card .en{font:500 11.5px var(--mono);color:var(--muted)}
.desc{margin:0;font-size:.92rem;text-wrap:pretty}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:0;padding:0;list-style:none}
.tags li{font-size:.76rem;line-height:1.5;padding:1px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.use{margin:0;font-size:.86rem;color:var(--muted)}
.use dt{display:inline;font-weight:700;color:var(--ink);margin-right:.6em}
.use dd{display:inline;margin:0}
.prompt{margin-top:auto;background:var(--surface2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.prompt .lbl{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.ptext{margin:0;font-size:.86rem;line-height:1.7;user-select:text}
.copy{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:2px 12px;font-size:.78rem;cursor:pointer}
.copy:hover{background:var(--accent);color:var(--accent-ink)}

/* ライトを動かす */
.lab{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.lab .frame{cursor:default;aspect-ratio:auto;min-height:280px;height:100%}
.lab-side{padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lab-side h3{margin:0;font-size:1.2rem;font-weight:900}
.lab-side p{margin:0;font-size:.86rem;color:var(--muted)}
.dial-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dial{width:132px;height:132px;flex:none;touch-action:none;cursor:grab}
.dial:active{cursor:grabbing}
.sliders{flex:1 1 150px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sliders label{display:block;font-size:.78rem;color:var(--muted)}
.sliders input[type=range]{width:100%;accent-color:var(--accent)}
.readout{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.readout .nm{font-size:1.35rem;font-weight:900;line-height:1.3}
.readout .vl{font:500 11.5px var(--mono);color:var(--muted)}
@media (max-width:760px){.lab{grid-template-columns:minmax(0,1fr)}.lab .frame{height:auto;aspect-ratio:16/10;min-height:0}}

/* 組み合わせ */
.combo{padding-top:56px}
.combos{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.combo-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.combo-card h3{margin:0;font-size:1rem;font-weight:900}
.combo-card .tg{display:flex;flex-wrap:wrap;gap:4px}
.combo-card .tg span{font-size:.76rem;background:var(--accent-soft);color:var(--accent);padding:1px 9px;border-radius:999px}
.foot{padding-block:36px 56px;color:var(--muted);font-size:.84rem;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
.foot p{margin:0;max-width:44em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font-size:.84rem;padding:8px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cbddf3"/><stop offset="1" stop-color="#eef3fa"/></linearGradient>
    <filter id="blur1" filterUnits="userSpaceOnUse" x="-80" y="-60" width="480" height="320"><feGaussianBlur stdDeviation="0.8"/></filter>
    <filter id="blur2" filterUnits="userSpaceOnUse" x="-80" y="-60" width="480" height="320"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="blur3" filterUnits="userSpaceOnUse" x="-80" y="-60" width="480" height="320"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="blur4" filterUnits="userSpaceOnUse" x="-80" y="-60" width="480" height="320"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="blur5" filterUnits="userSpaceOnUse" x="-80" y="-60" width="480" height="320"><feGaussianBlur stdDeviation="4.4"/></filter>
    <filter id="blur6" filterUnits="userSpaceOnUse" x="-80" y="-60" width="480" height="320"><feGaussianBlur stdDeviation="5.8"/></filter>
  </defs>
</svg>

<div class="wrap">
  <header class="hero">
    <p class="kicker">Camera &amp; Light Glossary</p>
    <h1>撮影用語帳</h1>
    <p class="lead">光、角度、レンズ、構図。画像生成や動画生成にそのまま使える言葉を、動く見本つきで一覧。指示文はワンクリックでコピーできます。</p>
    <ol class="steps">
      <li><span>01</span>見本の動きを見る</li>
      <li><span>02</span>指示文をコピー</li>
      <li><span>03</span>生成AIに貼りつける</li>
    </ol>
  </header>
</div>

<div class="bar">
  <div class="wrap bar-in">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
      <input id="q" type="search" placeholder="用語を検索（例 逆光、あおり、ボケ）" autocomplete="off" aria-label="用語を検索">
    </label>
    <div class="seg" role="group" aria-label="指示文の言語">
      <button type="button" id="lang-ja" aria-pressed="true">日本語</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
    <span class="count" id="count" aria-live="polite"></span>
    <div class="chips" id="chips" role="group" aria-label="カテゴリ"></div>
  </div>
</div>

<main class="wrap" id="main"></main>

<footer class="wrap foot">
  <p>見本は簡易的な3D描画です。実際の画像生成や動画生成では、モデルによって仕上がりが変わります。</p>
  <p>更新 2026年10月</p>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var CATS=[
 {id:'light',name:'ライティング',en:'Lighting',lead:'光の向き、高さ、強さ。同じ人物でも、光の置き方ひとつで印象がまるで変わります。'},
 {id:'angle',name:'アングル',en:'Camera angle',lead:'カメラの高さと傾き。見上げるか見下ろすかで、被写体の力関係が変わります。'},
 {id:'size',name:'ショットサイズ',en:'Shot size',lead:'被写体をどこまで大きく写すか。引きから寄りまで、切り取る範囲の呼び名。'},
 {id:'lens',name:'レンズ・ピント',en:'Lens & focus',lead:'画角とボケ。広く写すか、遠くから引き寄せるか、どこにピントを置くか。'},
 {id:'comp',name:'構図',en:'Composition',lead:'被写体を画面のどこに置くか。配置のルールにはそれぞれ名前がついています。'}
];

var EYE={f:35,frameH:3.8,h:1.6,ty:1.6};
var TERMS=[
/* ライティング */
{id:'front',cat:'light',ja:'順光',en:'Front light',alias:['フロントライト','正面光'],
 desc:'被写体の正面から当たる光。影が少なく、色と形が素直に写る。',
 mood:['明るい','素直','安心感'],use:'商品写真、証明写真、説明用の画像。迷ったらまずこれ。',
 pj:'正面からの順光で撮影。影が少なく、色が自然に出る明るい仕上がり。',
 pe:'Front lighting, soft and even, minimal shadows, natural colors.',
 demo:{kind:'light',show:1,seq:[{az:-80,el:6,i:1.2,amb:.1},{}]}},
{id:'back',cat:'light',ja:'逆光',en:'Backlight',alias:['バックライト','コントルジュール'],
 desc:'被写体の後ろから当たる光。輪郭が光り、顔や体は暗く沈む。',
 mood:['エモい','幻想的','ノスタルジー'],use:'夕方のシーン、空気感のあるポートレート、映画の一場面。',
 pj:'強い逆光。被写体の輪郭が光で縁取られ、背景に光がにじむ。',
 pe:'Strong backlight, glowing edge light around the subject, soft light bloom in the background.',
 demo:{kind:'light',show:1,seq:[{},{az:180,el:14,i:1.3,amb:.12,rimAz:180,rimEl:14,rimI:1.5,rimWarm:1,bg:.12,glow:.75}]}},
{id:'side',cat:'light',ja:'サイドライト',en:'Side light',alias:['横から','側光'],
 desc:'真横から当たる光。顔の半分が明るく、もう半分は影になる。',
 mood:['立体的','ドラマチック','力強い'],use:'力強さの表現、質感の強調、緊張感のある場面。',
 pj:'真横からのサイドライト。顔の片側だけが明るく、反対側は深い影。',
 pe:'Hard side lighting, half of the face in deep shadow, strong sense of volume.',
 demo:{kind:'light',show:1,seq:[{},{az:90,el:5,i:1.4,amb:.05}]}},
{id:'rim',cat:'light',ja:'リムライト',en:'Rim light',alias:['輪郭光','縁取り'],
 desc:'斜め後ろから当てて、輪郭だけを細く光らせる。被写体が背景から浮き上がる。',
 mood:['シャープ','SF的','浮き上がる'],use:'暗い背景で被写体を際立たせたいとき。SFやサイバー系の絵づくり。',
 pj:'斜め後ろからのリムライト。髪と肩の輪郭がくっきり光り、暗い背景から浮き立つ。',
 pe:'Rim light from behind, thin bright outline on hair and shoulders, subject separated from a dark background.',
 demo:{kind:'light',show:1,seq:[{},{az:-35,el:18,i:.35,amb:.06,rimAz:150,rimEl:22,rimI:1.6,bg:.05}]}},
{id:'rembrandt',cat:'light',ja:'レンブラントライト',en:'Rembrandt lighting',alias:['レンブラント','45度','三角の光'],
 desc:'斜め上45度から当てる光。影側の頬に、小さな逆三角形の光が残る。',
 mood:['クラシック','重厚','高級感'],use:'肖像画のような落ち着いた人物写真、ブランドの顔写真。',
 pj:'レンブラントライト。斜め上から光を当て、影側の頬に逆三角形の明るい部分が出る。',
 pe:'Rembrandt lighting, key light 45 degrees above and to the side, small triangle of light on the shadowed cheek, dark moody background.',
 demo:{kind:'light',show:1,seq:[{},{az:-42,el:42,i:1.5,amb:.06,bg:.05}]}},
{id:'top',cat:'light',ja:'トップライト',en:'Top light',alias:['真上','頭上'],
 desc:'真上から落ちる光。目の下とあごの下に濃い影ができる。',
 mood:['不穏','孤独','舞台的'],use:'スポットライトの舞台、取り調べ室のような張りつめた場面。',
 pj:'真上からのトップライト。目元とあごの下に濃い影が落ちる、緊張感のある絵。',
 pe:'Overhead top lighting, deep shadows under the eyes and chin, tense interrogation-room mood.',
 demo:{kind:'light',show:1,seq:[{},{az:0,el:78,i:1.6,amb:.05,bg:.06}]}},
{id:'under',cat:'light',ja:'アンダーライト',en:'Under lighting',alias:['ホラーライト','下から','下からの光'],

 pj:'下から照らすアンダーライト。顔に不自然な影が伸びる、不気味な雰囲気。',
 pe:'Under lighting from below, unnatural upward shadows across the face, eerie horror atmosphere.',
 demo:{kind:'light',show:1,seq:[{},{az:0,el:-52,i:1.4,amb:.05,bg:.05}]}},
{id:'highkey',cat:'light',ja:'ハイキー',en:'High-key',alias:['明るい','白背景','透明感'],
 desc:'全体を明るくまとめ、影を弱くした調子。軽くて清潔感のある画面になる。',
 mood:['爽やか','清潔','ポップ'],use:'美容、ウェルネス、白背景の商品、やさしいライフスタイル画像。',
 pj:'ハイキーな仕上がり。白に近い明るい背景で、影はごく薄く、透明感がある。',

 demo:{kind:'light',show:1,seq:[{},{az:15,el:22,i:.8,amb:.75,bg:.95,expo:1.35,soft:.22}]}},
{id:'lowkey',cat:'light',ja:'ローキー',en:'Low-key',alias:['暗い','ノワール','コントラスト'],

 pj:'ローキーな照明。画面の大半は闇で、光が当たるのは顔の一部だけ。',

{id:'silhouette',cat:'light',ja:'シルエット',en:'Silhouette',alias:['影絵','黒い影','夕焼け'],
 desc:'明るい背景の前で、被写体を真っ黒な影として見せる。形だけが残る。',

 pj:'シルエット。夕焼けを背に、人物は黒い影になり、形だけがはっきり見える。',
 pe:'Silhouette against a glowing sunset sky, subject fully black, only the shape visible.',
 demo:{kind:'light',show:1,seq:[{},{sil:1,bg:.82,glow:.5,az:180,rimAz:180,rimEl:15,rimI:.8,rimWarm:1,amb:0}]}},

/* アングル */
{id:'eye',cat:'angle',ja:'アイレベル',en:'Eye level',alias:['水平','目線'],
 desc:'人の目の高さから水平に撮る。いちばん自然で、見る人と同じ目線になる。',
 mood:['自然','フラット','親しみ'],use:'会話、日常、ドキュメンタリー風の画面。',
 pj:'アイレベルで撮影。人物の目の高さから水平に構えた、自然な視点。',

 dial.addEventListener('pointercancel',function(){dial._drag=false;});
 dialH.addEventListener('keydown',function(e){
  var d=e.key==='ArrowRight'||e.key==='ArrowUp'?-6:e.key==='ArrowLeft'||e.key==='ArrowDown'?6:0;
  if(d){e.preventDefault();lab.az+=d;if(lab.az>180)lab.az-=360;if(lab.az<-180)lab.az+=360;labUpdate();}
 });
 inEl.addEventListener('input',function(){lab.el=+inEl.value;labUpdate();});
 inI.addEventListener('input',function(){lab.i=+inI.value/100;labUpdate();});
 labUpdate();

 /* 検索と絞り込み */
 function apply(){
  var q=norm(state.q),shown=0,n,secs=main.querySelectorAll('.sec');
  for(n=0;n<cards.length;n++){var o=cards[n],ok=(state.cat==='all'||o.t.cat===state.cat)&&(!q||o.search.indexOf(q)>=0);o.el.hidden=!ok;if(ok)shown++;}
  for(n=0;n<secs.length;n++){
   var any=secs[n].querySelectorAll('.card:not([hidden])').length>0;secs[n].hidden=!any;
   var lb=secs[n].querySelector('.lab');if(lb)lb.hidden=!!q||state.cat!=='all'&&state.cat!=='light';
  }
  $('#combo').hidden=!(state.cat==='all'&&!q);
  $('#empty').hidden=shown>0;
  countEl.textContent=shown+'語';
 }
 $('#q').addEventListener('input',function(e){state.q=e.target.value;apply();});
 chipsEl.addEventListener('click',function(e){
  var b=e.target.closest('.chip');if(!b)return;
  state.cat=b.getAttribute('data-cat');
  var all=chipsEl.querySelectorAll('.chip'),n;for(n=0;n<all.length;n++)all[n].setAttribute('aria-pressed',all[n]===b?'true':'false');
  apply();
  var tgt=state.cat==='all'?main:$('#'+state.cat);if(tgt)tgt.scrollIntoView({block:'start'});
 });
 function setLang(l){
  state.lang=l;try{localStorage.setItem('satsuei-lang',l);}catch(e){}
  $('#lang-ja').setAttribute('aria-pressed',l==='ja'?'true':'false');$('#lang-en').setAttribute('aria-pressed',l==='en'?'true':'false');
  var n,pts=main.querySelectorAll('.card .ptext'),lbs=main.querySelectorAll('.plabel');
  for(n=0;n<cards.length;n++){var pe=$('.ptext',cards[n].el);pe.textContent=ptxt(cards[n].t);pe.setAttribute('lang',l==='ja'?'ja':'en');}
  var cps=main.querySelectorAll('.combo-card .ptext');
  for(n=0;n<cps.length;n++){cps[n].textContent=l==='ja'?COMBOS[n].pj:COMBOS[n].pe;cps[n].setAttribute('lang',l==='ja'?'ja':'en');}
  for(n=0;n<lbs.length;n++)lbs[n].textContent=l==='ja'?'指示文':'PROMPT';
  labUpdate();
 }
 $('#lang-ja').addEventListener('click',function(){setLang('ja');});
 $('#lang-en').addEventListener('click',function(){setLang('en');});

 /* コピー */
 function srcText(src){
  if(src==='lab')return ptxt(BYID[nameOf(lab.az,lab.el)]);
  if(src.indexOf('c:')===0){var cmb=COMBOS[+src.slice(2)];return state.lang==='ja'?cmb.pj:cmb.pe;}
  return ptxt(BYID[src.slice(2)]);
 }
 document.addEventListener('click',function(e){
  var b=e.target.closest('.copy');if(!b)return;
  var txt=srcText(b.getAttribute('data-src')),box=b.closest('.prompt');
  var done=function(){toast('コピーしました');b.textContent='コピー済み';setTimeout(function(){b.textContent='コピー';},1400);};
  var fallback=function(){
   try{var p=$('.ptext',box),r=document.createRange();r.selectNodeContents(p);var s=window.getSelection();s.removeAllRanges();s.addRange(r);
    var ok=document.execCommand&&document.execCommand('copy');toast(ok?'コピーしました':'選択しました。コピーしてください');}
   catch(x){toast('選択しました。コピーしてください');}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);}else fallback();
 });

 /* 初期状態 */
 var hs=(location.hash||'').replace('#','');
 if(hs&&$('#'+hs)&&$('#'+hs).getAttribute('data-cat')){
  state.cat=hs;var all=chipsEl.querySelectorAll('.chip'),n2;
  for(n2=0;n2<all.length;n2++)all[n2].setAttribute('aria-pressed',all[n2].getAttribute('data-cat')===hs?'true':'false');
 }
 setLang(state.lang);apply();
})();
</script>
